<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>str6f</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Переливающийся монохромный фон */
        body {
            background: linear-gradient(-45deg, #000000, #111111, #222222, #0d0d0d);
            background-size: 400% 400%;
            animation: gradientBg 12s ease infinite;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        @keyframes gradientBg {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* Чёрно-белый неоновый заголовок */
        h1 {
            color: #ffffff;
            font-size: 2.8rem;
            letter-spacing: 3px;
            margin-bottom: 5px;
            text-align: center;
            animation: neonGlow 3s ease-in-out infinite alternate;
        }

        @keyframes neonGlow {
            0% {
                text-shadow: 
                    0 0 5px rgba(255, 255, 255, 0.6),
                    0 0 10px rgba(255, 255, 255, 0.4),
                    0 0 20px rgba(255, 255, 255, 0.2);
            }
            100% {
                text-shadow: 
                    0 0 10px rgba(255, 255, 255, 1),
                    0 0 25px rgba(255, 255, 255, 0.8),
                    0 0 40px rgba(255, 255, 255, 0.6),
                    0 0 60px rgba(255, 255, 255, 0.4);
            }
        }

        p.subtitle {
            color: #888888;
            font-size: 0.9rem;
            margin-bottom: 25px;
            text-align: center;
        }

        /* Переливающиеся карточки */
        .card {
            background-color: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid #222222;
            border-radius: 14px;
            padding: 14px 20px;
            width: 100%;
            text-align: center;
            margin-bottom: 14px;
            text-decoration: none;
            color: #ffffff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            animation: cardGlow 4s infinite alternate ease-in-out;
        }

        @keyframes cardGlow {
            0% {
                border-color: #222222;
                box-shadow: 0 0 8px rgba(255, 255, 255, 0.05);
            }
            100% {
                border-color: #666666;
                box-shadow: 0 0 18px rgba(255, 255, 255, 0.2);
            }
        }

        .card:hover {
            border-color: #ffffff;
            background-color: rgba(30, 30, 30, 0.95);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .phone-card {
            color: #ffffff;
            font-weight: 500;
        }

        .map-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 16px;
            text-align: left;
        }

        .map-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ffffff;
        }

        .map-subtitle {
            color: #888888;
            font-size: 0.8rem;
            margin-bottom: 12px;
        }

        .map-frame {
            width: 100%;
            height: 160px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #333333;
            /* Тёмно-серый монохромный фильтр для карты */
            filter: grayscale(100%) invert(92%) contrast(83%);
        }

        .map-frame iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .map-footer {
            width: 100%;
            text-align: center;
            color: #888888;
            font-size: 0.8rem;
            margin-top: 10px;
            text-decoration: none;
            transition: color 0.2s;
        }

        .map-footer:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>str6f</h1>
        <p class="subtitle">Мои ссылки</p>

        <!-- Telegram -->
        <a href="https://t.me/str6f" class="card" target="_blank">
            Telegram: @str6f
        </a>
      <a href="https://github.com/str6f" rel="me noopener">GitHub</a><
        <!-- Номер телефона (монохромная иконка) -->
        <div class="card phone-card">
            <span>📞</span> +1 318 648 7698
        </div>

        <!-- Карта Голливуда -->
        <div class="card map-card">
            <div class="map-title">📍 USA</div>
            <div class="map-subtitle">Hollywood, Los Angeles, California</div>
            
            <div class="map-frame">
                <iframe 
                    src="https://www.openstreetmap.org/export/embed.html?bbox=-118.3400%2C34.0900%2C-118.3100%2C34.1100&amp;layer=mapnik" 
                    loading="lazy">
                </iframe>
            </div>

            <a href="https://www.openstreetmap.org/#map=15/34.1016/-118.3268" target="_blank" class="map-footer">
                Открыть карту
            </a>
        </div>
    </div>

</body>
</html>
