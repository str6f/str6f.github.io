<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>str6f</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Фоновая сетка с чертиками */
        #bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            grid-auto-rows: 90px;
            gap: 15px;
            padding: 10px;
            z-index: 1;
            pointer-events: none;
            opacity: 0.9;
        }

        .bg-icon {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.15;
            transition: opacity 1s ease, filter 1s ease;
        }

        .bg-icon img {
            width: 55px;
            height: 55px;
            object-fit: contain;
            /* Убирает черный квадрат вокруг картинки */
            mix-blend-mode: screen; 
        }

        /* Плавное белое мерцание случайных чертиков */
        .bg-icon.glow {
            animation: randomGlow 4s infinite ease-in-out;
        }

        @keyframes randomGlow {
            0%, 100% {
                opacity: 0.12;
                filter: drop-shadow(0 0 0px rgba(255, 255, 255, 0));
            }
            50% {
                opacity: 0.95;
                filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9)) drop-shadow(0 0 20px rgba(255, 255, 255, 0.5));
            }
        }

        /* Главный контейнер */
        .container {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        /* Аватарка профиля */
        .profile-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 2px solid #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            animation: avatarGlow 3s infinite alternate ease-in-out;
        }

        @keyframes avatarGlow {
            0% {
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
                border-color: #888888;
            }
            100% {
                box-shadow: 0 0 25px rgba(255, 255, 255, 0.8);
                border-color: #ffffff;
            }
        }

        /* Неоновый заголовок */
        h1 {
            color: #ffffff;
            font-size: 2.8rem;
            letter-spacing: 3px;
            margin-bottom: 5px;
            text-align: center;
            position: relative;
            animation: neonGlow 3s ease-in-out infinite alternate;
        }

        @keyframes neonGlow {
            0% {
                text-shadow: 
                    0 0 5px rgba(255, 255, 255, 0.6),
                    0 0 10px rgba(255, 255, 255, 0.4);
            }
            100% {
                text-shadow: 
                    0 0 10px rgba(255, 255, 255, 1),
                    0 0 25px rgba(255, 255, 255, 0.8),
                    0 0 45px rgba(255, 255, 255, 0.6);
            }
        }

        p.subtitle {
            color: #888888;
            font-size: 0.9rem;
            margin-bottom: 25px;
            text-align: center;
        }

        /* Карточки */
        .card {
            background-color: rgba(10, 10, 10, 0.88);
            backdrop-filter: blur(10px);
            border: 1px solid #222222;
            border-radius: 14px;
            padding: 14px 20px;
            width: 100%;
            text-align: center;
            margin-bottom: 14px;
            text-decoration: none;
            color: #ffffff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            animation: cardGlow 4s infinite alternate ease-in-out;
        }

        .card-icon {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        @keyframes cardGlow {
            0% {
                border-color: #222222;
                box-shadow: 0 0 8px rgba(255, 255, 255, 0.05);
            }
            100% {
                border-color: #555555;
                box-shadow: 0 0 18px rgba(255, 255, 255, 0.2);
            }
        }

        .card:hover {
            border-color: #ffffff;
            background-color: rgba(25, 25, 25, 0.95);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }

        .phone-card {
            color: #ffffff;
            font-weight: 500;
        }

        .map-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 16px;
            text-align: left;
        }

        .map-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ffffff;
        }

        .map-subtitle {
            color: #888888;
            font-size: 0.8rem;
            margin-bottom: 12px;
        }

        .map-frame {
            width: 100%;
            height: 160px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #333333;
            filter: grayscale(100%) invert(92%) contrast(83%);
        }

        .map-frame iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .map-footer {
            width: 100%;
            text-align: center;
            color: #888888;
            font-size: 0.8rem;
            margin-top: 10px;
            text-decoration: none;
            transition: color 0.2s;
        }

        .map-footer:hover {
            color: #ffffff;
        }

        /* Счётчик просмотров */
        .views-counter {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #666666;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(15, 15, 15, 0.8);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #222222;
            transition: all 0.3s ease;
        }

        .views-counter:hover {
            color: #ffffff;
            border-color: #444444;
        }

        .views-counter span {
            color: #ffffff;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Сетка фона -->
    <div id="bg-grid"></div>

    <div class="container">
        <!-- Аватарка профиля -->
        <img src="https://i.postimg.cc/K1Gz1cHd/IMG-8292.jpg" alt="str6f" class="profile-avatar">

        <h1>str6f</h1>
        <p class="subtitle">Мои ссылки</p>

        <!-- Telegram -->
        <a href="https://t.me/str6f" class="card" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram" class="card-icon">
            <span>Telegram</span>
        </a>

        <!-- Discord Channel -->
        <a href="https://discord.gg/xn5xf3Z8S" class="card" target="_blank">
            <img src="https://i.postimg.cc/fV8bmn4J/454e54e8-960a-4973-81f2-df6ce8180cc5.jpg" alt="Discord" class="card-icon">
            <span>Discord Channel</span>
        </a>

        <!-- Steam -->
        <a href="https://steamcommunity.com/profiles/76561199045709699/" class="card" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg" alt="Steam" class="card-icon">
            <span>Steam</span>
        </a>

        <!-- Номер телефона -->
        <div class="card phone-card">
            <span>📞</span> +1 318 648 7698
        </div>

        <!-- Карта Голливуда -->
        <div class="card map-card">
            <div class="map-title">📍 USA</div>
            <div class="map-subtitle">Hollywood, Los Angeles, California</div>
            
            <div class="map-frame">
                <iframe 
                    src="https://www.openstreetmap.org/export/embed.html?bbox=-118.3400%2C34.0900%2C-118.3100%2C34.1100&amp;layer=mapnik" 
                    loading="lazy">
                </iframe>
            </div>

            <a href="https://www.openstreetmap.org/#map=15/34.1016/-118.3268" target="_blank" class="map-footer">
                Открыть карту
            </a>
        </div>

        <!-- Счётчик просмотров -->
        <div class="views-counter">
            👁️ views: <span id="visit-count">...</span>
        </div>
    </div>

    <script>
        // Счётчик просмотров
        async function updateCounter() {
            try {
                const res = await fetch('https://api.countapi.xyz/hit/str6f-github-io/pageviews');
                const data = await res.json();
                document.getElementById('visit-count').textContent = data.value;
            } catch (e) {
                document.getElementById('visit-count').textContent = '1,337';
            }
        }
        updateCounter();

        // Генерация фоновой сетки
        const bgGrid = document.getElementById('bg-grid');
        const cols = Math.ceil(window.innerWidth / 100);
        const rows = Math.ceil(window.innerHeight / 100);
        const totalIcons = cols * rows;

        for (let i = 0; i < totalIcons; i++) {
            const iconDiv = document.createElement('div');
            iconDiv.className = 'bg-icon';
            
            const img = document.createElement('img');
            img.src = 'https://i.ibb.co/s9fZYf8j/63131a.jpg';
            iconDiv.appendChild(img);

            // Рандомное мягкое мерцание чертиков
            if (Math.random() > 0.5) {
                iconDiv.classList.add('glow');
                const delay = (Math.random() * 6).toFixed(2);
                const duration = (3 + Math.random() * 3).toFixed(2);
                iconDiv.style.animationDelay = `${delay}s`;
                iconDiv.style.animationDuration = `${duration}s`;
            }

            bgGrid.appendChild(iconDiv);
        }
    </script>
</body>
</html>
