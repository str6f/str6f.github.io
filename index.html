<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>str6f</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Фоновая сетка с иконками Doxbin */
        #bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            grid-auto-rows: 70px;
            gap: 15px;
            padding: 10px;
            z-index: 1;
            pointer-events: none;
            opacity: 0.85;
        }

        .bg-icon {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.12;
            transition: opacity 0.5s ease, filter 0.5s ease;
        }

        .bg-icon svg {
            width: 42px;
            height: 42px;
            fill: none;
            stroke: #666666;
            stroke-width: 1.8;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        /* Эффект гирлянды: вспыхивание и неон */
        .bg-icon.glow {
            animation: flickerGlow 3.5s infinite ease-in-out;
        }

        @keyframes flickerGlow {
            0%, 100% {
                opacity: 0.12;
                filter: none;
            }
            50% {
                opacity: 0.95;
                filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.9)) 
                        drop-shadow(0 0 16px rgba(255, 255, 255, 0.6));
            }
        }

        .bg-icon.glow svg {
            stroke: #ffffff;
        }

        /* Контейнеры секций над фоном */
        .section {
            min-height: 85vh;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }
        
        /* Чёрно-белый неоновый заголовок */
        h1 {
            color: #ffffff;
            font-size: 2.8rem;
            letter-spacing: 3px;
            margin-bottom: 5px;
            text-align: center;
            animation: neonGlow 3s ease-in-out infinite alternate;
        }

        @keyframes neonGlow {
            0% {
                text-shadow: 
                    0 0 5px rgba(255, 255, 255, 0.6),
                    0 0 10px rgba(255, 255, 255, 0.4);
            }
            100% {
                text-shadow: 
                    0 0 10px rgba(255, 255, 255, 1),
                    0 0 25px rgba(255, 255, 255, 0.8),
                    0 0 45px rgba(255, 255, 255, 0.6);
            }
        }

        p.subtitle {
            color: #888888;
            font-size: 0.9rem;
            margin-bottom: 25px;
            text-align: center;
        }

        /* Карточки */
        .card {
            background-color: rgba(10, 10, 10, 0.88);
            backdrop-filter: blur(10px);
            border: 1px solid #222222;
            border-radius: 14px;
            padding: 14px 20px;
            width: 100%;
            text-align: center;
            margin-bottom: 14px;
            text-decoration: none;
            color: #ffffff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            animation: cardGlow 4s infinite alternate ease-in-out;
        }

        @keyframes cardGlow {
            0% {
                border-color: #222222;
                box-shadow: 0 0 8px rgba(255, 255, 255, 0.05);
            }
            100% {
                border-color: #555555;
                box-shadow: 0 0 18px rgba(255, 255, 255, 0.2);
            }
        }

        .card:hover {
            border-color: #ffffff;
            background-color: rgba(25, 25, 25, 0.95);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }

        .phone-card {
            color: #ffffff;
            font-weight: 500;
        }

        .map-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 16px;
            text-align: left;
        }

        .map-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ffffff;
        }

        .map-subtitle {
            color: #888888;
            font-size: 0.8rem;
            margin-bottom: 12px;
        }

        .map-frame {
            width: 100%;
            height: 160px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #333333;
            filter: grayscale(100%) invert(92%) contrast(83%);
        }

        .map-frame iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .map-footer {
            width: 100%;
            text-align: center;
            color: #888888;
            font-size: 0.8rem;
            margin-top: 10px;
            text-decoration: none;
            transition: color 0.2s;
        }

        .map-footer:hover {
            color: #ffffff;
        }

        /* Анимированная стрелочка вниз */
        .scroll-down {
            margin-top: 15px;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.8rem;
            animation: bounce 2s infinite;
            display: inline-block;
            cursor: pointer;
            transition: text-shadow 0.3s ease;
        }

        .scroll-down:hover {
            text-shadow: 0 0 10px #ffffff;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        /* Стиль для второго блока Deff */
        .deff-card {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            padding: 18px 25px;
            background: rgba(15, 15, 15, 0.9);
            border-color: #555555;
        }

        .deff-card span {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>

    <!-- Сетка фона -->
    <div id="bg-grid"></div>

    <!-- Первая секция -->
    <div class="section" id="top">
        <h1>str6f</h1>
        <p class="subtitle">Мои ссылки</p>

        <!-- Telegram -->
        <a href="https://t.me/str6f" class="card" target="_blank">
            Telegram: @str6f
        </a>

        <!-- Discord Channel -->
        <a href="https://discord.gg/xn5xf3Z8S" class="card" target="_blank">
            Discord Channel
        </a>

        <!-- Номер телефона -->
        <div class="card phone-card">
            <span>📞</span> +1 318 648 7698
        </div>

        <!-- Карта Голливуда -->
        <div class="card map-card">
            <div class="map-title">📍 USA</div>
            <div class="map-subtitle">Hollywood, Los Angeles, California</div>
            
            <div class="map-frame">
                <iframe 
                    src="https://www.openstreetmap.org/export/embed.html?bbox=-118.3400%2C34.0900%2C-118.3100%2C34.1100&amp;layer=mapnik" 
                    loading="lazy">
                </iframe>
            </div>

            <a href="https://www.openstreetmap.org/#map=15/34.1016/-118.3268" target="_blank" class="map-footer">
                Открыть карту
            </a>
        </div>

        <!-- Кнопка-стрелочка для перехода вниз -->
        <a href="#deff-section" class="scroll-down" title="Проскроллить вниз">↓</a>
    </div>

    <!-- Вторая секция -->
    <div class="section" id="deff-section">
        <div class="card deff-card">
            🛡️ My Deff: <span>@Str6f</span>
        </div>
    </div>

    <script>
        // SVG иконка Doxbin (рогатый череп)
        const doxbinSvg = `
        <svg viewBox="0 0 100 100">
            <!-- Рога -->
            <path d="M 28 32 C 18 12, 28 2, 34 8 C 30 18, 36 28, 38 34" />
            <path d="M 72 32 C 82 12, 72 2, 66 8 C 70 18, 64 28, 62 34" />
            <!-- Уши -->
            <path d="M 26 40 C 12 42, 16 56, 26 58" />
            <path d="M 74 40 C 88 42, 84 56, 74 58" />
            <!-- Голова и подбородок -->
            <path d="M 32 30 C 42 22, 58 22, 68 30 C 76 44, 72 68, 50 90 C 28 68, 24 44, 32 30 Z" />
            <!-- Глаза -->
            <path d="M 33 50 L 46 54 L 35 59 Z" />
            <path d="M 67 50 L 54 54 L 65 59 Z" />
            <!-- Оскал / Зубы -->
            <path d="M 36 68 Q 50 78 64 68" />
            <path d="M 40 69 L 43 75 L 46 70 L 50 76 L 54 70 L 57 75 L 60 69" />
        </svg>`;

        const bgGrid = document.getElementById('bg-grid');
        
        // Вычисляем сколько элементов поместится на экран
        const cols = Math.ceil(window.innerWidth / 85);
        const rows = Math.ceil(window.innerHeight / 85);
        const totalIcons = cols * rows;

        for (let i = 0; i < totalIcons; i++) {
            const iconDiv = document.createElement('div');
            iconDiv.className = 'bg-icon';
            iconDiv.innerHTML = doxbinSvg;

            // Случайным образом назначаем загорающиеся иконки (как гирлянда)
            if (Math.random() > 0.45) {
                iconDiv.classList.add('glow');
                // Рандомная задержка анимации
                const delay = (Math.random() * 5).toFixed(2);
                const duration = (2.5 + Math.random() * 2.5).toFixed(2);
                iconDiv.style.animationDelay = `${delay}s`;
                iconDiv.style.animationDuration = `${duration}s`;
            }

            bgGrid.appendChild(iconDiv);
        }
    </script>
</body>
</html>
