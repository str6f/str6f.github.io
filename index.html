<style>
:root {
  /* Чёрно-белая неоновая палитра */
  --bg: #000000;
  --ink: #ffffff;
  --dim: #888888;
  --neon: #ffffff;
  --line: #222222;
  --card-bg: rgba(18, 18, 18, 0.85);
}

* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }

/* Анимированный переливающийся чёрно-серый фон */
body {
  background: radial-gradient(circle at 50% 38%, #1f1f1f 0%, var(--bg) 70%),
              linear-gradient(-45deg, #000000, #111111, #1c1c1c, #050505);
  background-size: 100% 100%, 400% 400%;
  animation: bgMove 12s ease infinite;
  color: var(--ink);
  font-family: Manrope, system-ui, sans-serif;
  display: grid;
  place-items: center;
  padding: 24px;
}

@keyframes bgMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

main { width: 100%; max-width: 420px; text-align: center; }

/* Белый неоновый заголовок с эффектом «включения» */
h1 {
  font-family: "Tilt Neon", system-ui, sans-serif;
  font-weight: 400;
  font-size: clamp(3rem, 16vw, 5rem);
  line-height: 1;
  color: #ffffff;
  letter-spacing: .02em;
  text-shadow: 0 0 4px #fff, 0 0 12px var(--neon), 0 0 28px var(--neon), 0 0 60px rgba(255, 255, 255, 0.5);
  animation: on 1.4s steps(1) 1 both, pulseGlow 3s ease-in-out infinite alternate;
}

/* Анимация включения неона */
@keyframes on {
  0% { opacity: .1; text-shadow: none; }
  10% { opacity: 1; }
  14% { opacity: .15; }
  20% { opacity: 1; }
  26% { opacity: .3; }
  34%, 100% { opacity: 1; }
}

/* Плавное пульсирующее свечение заголовка */
@keyframes pulseGlow {
  0% { text-shadow: 0 0 4px #fff, 0 0 12px rgba(255, 255, 255, 0.6), 0 0 28px rgba(255, 255, 255, 0.3); }
  100% { text-shadow: 0 0 8px #fff, 0 0 20px rgba(255, 255, 255, 1), 0 0 45px rgba(255, 255, 255, 0.8), 0 0 70px rgba(255, 255, 255, 0.5); }
}

p.tag { margin: 14px 0 40px; color: var(--dim); }
ul { list-style: none; padding: 0; display: grid; gap: 12px; }

/* Стилизация карточек-ссылок */
a {
  display: block;
  padding: 15px 18px;
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--ink);
  text-decoration: none;
  font-weight: 600;
  background: var(--card-bg);
  backdrop-filter: blur(8px);
  transition: border-color .3s, box-shadow .3s, transform .2s;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
}

a:hover, a:focus-visible {
  border-color: var(--neon);
  box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
  transform: translateY(-2px);
  outline: none;
}

.phone {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: #ffffff;
  border-color: rgba(255, 255, 255, 0.2);
  letter-spacing: .04em;
}

.phone svg, .loc svg { width: 20px; height: 20px; flex: none; }

/* Блок локации */
.loc {
  margin-top: 28px;
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  background: var(--card-bg);
  backdrop-filter: blur(8px);
  text-align: left;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
  transition: border-color .3s, box-shadow .3s;
}

.loc:hover {
  border-color: rgba(255, 255, 255, 0.4);
  box-shadow: 0 0 18px rgba(255, 255, 255, 0.15);
}

.loc header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; }
.loc header svg { color: var(--neon); filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8)); }
.loc b { display: block; font-weight: 600; color: #ffffff; }
.loc small { color: var(--dim); }

/* Монохромная тёмная карта */
.map { position: relative; height: 190px; border-top: 1px solid var(--line); }
.map iframe {
  width: 100%;
  height: 100%;
  border: 0;
  filter: grayscale(100%) invert(92%) contrast(83%);
}

.loc a.open {
  border: 0;
  border-top: 1px solid var(--line);
  border-radius: 0;
  text-align: center;
  color: var(--dim);
  font-weight: 400;
  font-size: .9rem;
  padding: 11px;
}

.loc a.open:hover { color: #ffffff; }

@media (prefers-reduced-motion:reduce) {
  h1 { animation: none; }
  a, body { transition: none; animation: none; }
}
</style>
